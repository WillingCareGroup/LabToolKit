<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACS Data Transformer - Melted Table</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lucide-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Simple Lucide icons as SVG components
        const Upload = () => (
            <svg className="lucide-icon" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        );

        const Download = () => (
            <svg className="lucide-icon" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17,8 12,3 7,8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        );

        const FileText = () => (
            <svg className="lucide-icon" viewBox="0 0 24 24">
                <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
            </svg>
        );

        const AlertCircle = () => (
            <svg className="lucide-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        );

        const parseWell = (name) => {
            if (!name || typeof name !== 'string') return null;
            const m = name.match(/^([A-H])(\d{1,2})$/);
            if (!m) return null;
            const row = m[1].charCodeAt(0) - 65;
            const col = parseInt(m[2], 10) - 1;
            if (row < 0 || row > 7 || col < 0 || col > 11) return null;
            return { row, col };
        };

        const wellName = (row, col) => String.fromCharCode(65 + row) + (col + 1);

        const enumerateRect = (anchor, rows, cols, order) => {
            const wells = [];
            if (order === 'col') {
                for (let c = 0; c < cols; c++) {
                    for (let r = 0; r < rows; r++) {
                        wells.push({ row: anchor.row + r, col: anchor.col + c });
                    }
                }
            } else {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        wells.push({ row: anchor.row + r, col: anchor.col + c });
                    }
                }
            }
            return wells;
        };

        const boundingRect = (wells) => {
            if (!wells || wells.length === 0) return null;
            let minR = 7, maxR = 0, minC = 11, maxC = 0;
            wells.forEach(w => {
                if (w.row < minR) minR = w.row;
                if (w.row > maxR) maxR = w.row;
                if (w.col < minC) minC = w.col;
                if (w.col > maxC) maxC = w.col;
            });
            return { anchor: { row: minR, col: minC }, rows: maxR - minR + 1, cols: maxC - minC + 1 };
        };

        const FacsDataTransformer = () => {
            const [originalData, setOriginalData] = useState(null);
            const [transformedData, setTransformedData] = useState(null);
            const [meltedData, setMeltedData] = useState(null);
            const [processing, setProcessing] = useState(false);
            const [error, setError] = useState(null);
            const [stats, setStats] = useState(null);
            const [baseColumnOrder, setBaseColumnOrder] = useState([]);
            const [baseSampleOrder, setBaseSampleOrder] = useState([]);
            const [selectedColumns, setSelectedColumns] = useState([]);
            const [selectedSamples, setSelectedSamples] = useState([]);
            const [includeAlias, setIncludeAlias] = useState(false);
            const [sourceFileName, setSourceFileName] = useState('');
            const [dragItem, setDragItem] = useState(null);
            const [dragOver, setDragOver] = useState(null);
            const [remapState, setRemapState] = useState(null);

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setProcessing(true);
                setError(null);
                setSourceFileName(file.name || '');
                
                try {
                    const buffer = await file.arrayBuffer();
                    const workbook = XLSX.read(buffer, { cellStyles: true, cellFormulas: true });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    
                    setOriginalData(rawData);
                    
                    const transformed = transformFacsData(rawData);
                    setTransformedData(transformed);
                    
                    const { meltedTable, columnOrder, sampleOrder } = meltDataToXYTable(transformed);
                    setMeltedData(meltedTable);
                    setBaseColumnOrder(columnOrder);
                    setBaseSampleOrder(sampleOrder);
                    setSelectedColumns(columnOrder);
                    setSelectedSamples(sampleOrder.map((name) => ({ name, alias: '' })));
                    setIncludeAlias(false);
                    
                } catch (err) {
                    setError(`Error processing file: ${err.message}`);
                } finally {
                    setProcessing(false);
                }
            };

            const transformFacsData = (rawData) => {
                const result = [];
                const samples = [];
                
                for (let i = 1; i < rawData.length; i++) {
                    const row = rawData[i];
                    const [depth, name, statistic, cells] = row;
                    
                    if (depth === '' && name && name.includes('.fcs')) {
                        const sampleName = name.split(' ')[0];
                        samples.push({
                            sampleName,
                            startRow: i,
                            gates: []
                        });
                    }
                }
                
                samples.forEach((sample, sampleIndex) => {
                    const endRow = sampleIndex + 1 < samples.length ? samples[sampleIndex + 1].startRow : rawData.length;
                    let lastNonFreqGate = '';
                    
                    for (let i = sample.startRow; i < endRow; i++) {
                        const row = rawData[i];
                        const [depth, name, statistic, cells] = row;
                        
                        if (!depth && !name) continue;
                        
                        const depthNumber = depth ? (depth.match(/>/g) || []).length : 0;
                        const isFreqRow = name && name.includes('Freq.');
                        
                        let gateName = '';
                        if (name) {
                            if (isFreqRow) {
                                const freqMatch = name.match(/Freq\. of (.+?) =/);
                                const freqTarget = freqMatch ? freqMatch[1] : 'Unknown';
                                gateName = `${lastNonFreqGate} of ${freqTarget}`;
                            } else {
                                const parts = name.split('/');
                                gateName = parts[parts.length - 1];
                                lastNonFreqGate = gateName;
                            }
                        }
                        
                        const transformedRow = {
                            Sample: sample.sampleName,
                            Gate: gateName,
                            Depth: depthNumber,
                            Count: cells || '',
                            Percentage: statistic || '',
                            Type: isFreqRow ? 'Frequency' : 'Gate',
                            FullPath: name || ''
                        };
                        
                        result.push(transformedRow);
                    }
                });
                
                const uniqueSamples = [...new Set(result.map(r => r.Sample))];
                const uniqueGates = [...new Set(result.map(r => r.Gate))];
                const freqRows = result.filter(r => r.Type === 'Frequency').length;
                const gateRows = result.filter(r => r.Type === 'Gate').length;
                
                setStats({
                    totalRows: result.length,
                    samples: uniqueSamples.length,
                    uniqueGates: uniqueGates.length,
                    frequencyRows: freqRows,
                    gateRows: gateRows
                });
                
                return result;
            };

            const meltDataToXYTable = (transformedData) => {
                // Group data by sample
                const sampleGroups = {};
                transformedData.forEach(row => {
                    if (!sampleGroups[row.Sample]) {
                        sampleGroups[row.Sample] = [];
                    }
                    sampleGroups[row.Sample].push(row);
                });

                const sampleOrder = [];
                const sampleSeen = new Set();
                transformedData.forEach(row => {
                    if (!sampleSeen.has(row.Sample)) {
                        sampleSeen.add(row.Sample);
                        sampleOrder.push(row.Sample);
                    }
                });

                // Create melted table
                const meltedTable = [];
                const allColumns = ['Sample'];
                const columnSeen = new Set(allColumns);

                // First pass: collect all possible columns in encounter order
                transformedData.forEach(row => {
                    const gateName = row.Depth === 0 ? 'Total Event' : row.Gate;
                    
                    if (row.Type === 'Frequency') {
                        const freqColumnName = `${row.Depth}.${gateName}.Freq`;
                        if (!columnSeen.has(freqColumnName)) {
                            columnSeen.add(freqColumnName);
                            allColumns.push(freqColumnName);
                        }
                    } else {
                        const countColumnName = `${row.Depth}.${gateName}.Count`;
                        const percentColumnName = `${row.Depth}.${gateName}.%`;
                        if (!columnSeen.has(countColumnName)) {
                            columnSeen.add(countColumnName);
                            allColumns.push(countColumnName);
                        }
                        if (!columnSeen.has(percentColumnName)) {
                            columnSeen.add(percentColumnName);
                            allColumns.push(percentColumnName);
                        }
                    }
                });

                // Second pass: create the melted table
                sampleOrder.forEach(sampleName => {
                    const sampleData = sampleGroups[sampleName] || [];
                    const sampleRow = { Sample: sampleName };
                    
                    // Initialize all columns with empty values
                    allColumns.forEach(col => {
                        if (col !== 'Sample') {
                            sampleRow[col] = '';
                        }
                    });

                    // Fill in the data
                    sampleData.forEach(row => {
                        const gateName = row.Depth === 0 ? 'Total Event' : row.Gate;
                        
                        if (row.Type === 'Frequency') {
                            const freqColumnName = `${row.Depth}.${gateName}.Freq`;
                            sampleRow[freqColumnName] = row.Percentage;
                        } else {
                            const countColumnName = `${row.Depth}.${gateName}.Count`;
                            const percentColumnName = `${row.Depth}.${gateName}.%`;
                            sampleRow[countColumnName] = row.Count;
                            sampleRow[percentColumnName] = row.Percentage;
                        }
                    });

                    meltedTable.push(sampleRow);
                });

                return { meltedTable, columnOrder: allColumns, sampleOrder };
            };

            const getAvailableColumns = () => {
                const allColumns = includeAlias
                    ? [...baseColumnOrder, 'SampleAlias']
                    : [...baseColumnOrder];
                return allColumns.filter(col => !selectedColumns.includes(col));
            };

            const getAvailableSamples = () => {
                const selectedNames = new Set(selectedSamples.map(s => s.name));
                return baseSampleOrder.filter(name => !selectedNames.has(name));
            };

            const buildOutputData = () => {
                if (!meltedData) return null;
                const rowMap = {};
                meltedData.forEach(row => {
                    rowMap[row.Sample] = row;
                });

                const outputRows = selectedSamples.map((entry) => {
                    const baseRow = rowMap[entry.name] || {};
                    const row = {};
                    selectedColumns.forEach(col => {
                        if (col === 'SampleAlias') {
                            row[col] = includeAlias ? (entry.alias || '') : '';
                        } else if (col === 'Sample') {
                            row[col] = entry.name || baseRow[col] || '';
                        } else {
                            row[col] = baseRow[col] ?? '';
                        }
                    });
                    return row;
                });

                return outputRows;
            };

            const moveItem = (items, fromIndex, toIndex) => {
                if (toIndex < 0 || toIndex >= items.length) return items;
                const next = items.slice();
                const [moved] = next.splice(fromIndex, 1);
                next.splice(toIndex, 0, moved);
                return next;
            };

            const handleDragStart = (type, index) => {
                setDragItem({ type, index });
            };

            const handleDragOver = (event, type, index) => {
                event.preventDefault();
                setDragOver({ type, index });
            };

            const handleDragEnd = () => {
                setDragItem(null);
                setDragOver(null);
            };

            const handleDrop = (type, index) => {
                if (!dragItem || dragItem.type !== type) return;
                if (type === 'columns') {
                    setSelectedColumns((prev) => moveItem(prev, dragItem.index, index));
                } else if (type === 'samples') {
                    setSelectedSamples((prev) => moveItem(prev, dragItem.index, index));
                }
                setDragItem(null);
                setDragOver(null);
            };

            const getCellClass = (columnName) => {
                if (columnName === 'Sample' || columnName === 'SampleAlias') {
                    return 'bg-white text-gray-900';
                }
                if (columnName.endsWith('.Count')) {
                    return 'bg-emerald-50 text-emerald-900';
                }
                if (columnName.endsWith('.%')) {
                    return 'bg-amber-50 text-amber-900';
                }
                if (columnName.endsWith('.Freq')) {
                    return 'bg-blue-50 text-blue-900';
                }
                return 'bg-white text-gray-900';
            };

            const getColumnBadgeClass = (columnName) => {
                if (columnName === 'Sample') {
                    return 'bg-slate-100 text-slate-800 border-slate-200';
                }
                if (columnName === 'SampleAlias') {
                    return 'bg-slate-50 text-slate-700 border-slate-200';
                }
                if (columnName.endsWith('.Count')) {
                    return 'bg-emerald-50 text-emerald-900 border-emerald-200';
                }
                if (columnName.endsWith('.%')) {
                    return 'bg-amber-50 text-amber-900 border-amber-200';
                }
                if (columnName.endsWith('.Freq')) {
                    return 'bg-blue-50 text-blue-900 border-blue-200';
                }
                return 'bg-white text-gray-900 border-gray-200';
            };

            const toggleAliasColumn = (enabled) => {
                setIncludeAlias(enabled);
                if (enabled) {
                    if (!selectedColumns.includes('SampleAlias')) {
                        const insertIndex = selectedColumns.indexOf('Sample');
                        const next = selectedColumns.slice();
                        if (insertIndex >= 0) {
                            next.splice(insertIndex + 1, 0, 'SampleAlias');
                        } else {
                            next.unshift('SampleAlias');
                        }
                        setSelectedColumns(next);
                    }
                } else {
                    setSelectedColumns(selectedColumns.filter(col => col !== 'SampleAlias'));
                }
            };

            const downloadMeltedData = () => {
                const outputData = buildOutputData();
                if (!outputData || outputData.length === 0) return;
                
                const worksheet = XLSX.utils.json_to_sheet(outputData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, 'Melted_FACS_Data');
                
                // Auto-size columns
                const maxColWidth = 30;
                const colWidths = Object.keys(outputData[0] || {}).map(key => ({
                    wch: Math.min(key.length + 2, maxColWidth)
                }));
                worksheet['!cols'] = colWidths;
                
                XLSX.writeFile(workbook, 'melted_facs_data.xlsx');
            };

            const downloadLayout = () => {
                if (!meltedData) return;
                const layout = {
                    version: 1,
                    createdAt: new Date().toISOString(),
                    sourceFile: sourceFileName,
                    includeAlias,
                    selectedColumns,
                    selectedSamples
                };
                const blob = new Blob([JSON.stringify(layout, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'facs_layout.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const resolveLayoutColumns = (layout, nextIncludeAlias) => {
                const availableColumns = nextIncludeAlias
                    ? [...baseColumnOrder, 'SampleAlias']
                    : [...baseColumnOrder];
                const columnSet = new Set(availableColumns);
                const filteredColumns = Array.isArray(layout.selectedColumns)
                    ? layout.selectedColumns.filter(col => columnSet.has(col))
                    : availableColumns;
                let nextColumns = filteredColumns.length > 0 ? filteredColumns : availableColumns;
                if (nextIncludeAlias && !nextColumns.includes('SampleAlias')) {
                    const insertIndex = nextColumns.indexOf('Sample');
                    const withAlias = nextColumns.slice();
                    if (insertIndex >= 0) {
                        withAlias.splice(insertIndex + 1, 0, 'SampleAlias');
                    } else {
                        withAlias.unshift('SampleAlias');
                    }
                    nextColumns = withAlias;
                }
                return { nextColumns, hadMissing: filteredColumns.length === 0 };
            };

            const handleLayoutUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (!meltedData) {
                    setError('Load a FACS file before importing a layout.');
                    return;
                }
                const proceed = window.confirm('Importing a layout will overwrite current selections. Continue?');
                if (!proceed) return;

                try {
                    const text = await file.text();
                    const layout = JSON.parse(text);
                    const nextIncludeAlias = !!layout.includeAlias;
                    const { nextColumns, hadMissing } = resolveLayoutColumns(layout, nextIncludeAlias);

                    const layoutSamplesRaw = Array.isArray(layout.selectedSamples)
                        ? layout.selectedSamples.filter(s => s && s.name).map(s => ({ name: s.name, alias: s.alias || '' }))
                        : baseSampleOrder.map(name => ({ name, alias: '' }));

                    const sampleSet = new Set(baseSampleOrder);
                    const exact = layoutSamplesRaw.filter(s => sampleSet.has(s.name));
                    const missing = layoutSamplesRaw.filter(s => !sampleSet.has(s.name));

                    const layoutWellSamples = layoutSamplesRaw.filter(s => parseWell(s.name));
                    const fileWellNames = baseSampleOrder.filter(n => parseWell(n));

                    // Open remap dialog if any layout samples are missing and both sides have wells to work with.
                    if (missing.length > 0 && layoutWellSamples.length > 0 && fileWellNames.length > 0) {
                        const layoutWells = layoutWellSamples.map(s => parseWell(s.name));
                        const layoutBox = boundingRect(layoutWells) || { anchor: { row: 0, col: 0 }, rows: 3, cols: 8 };
                        const fileWells = fileWellNames.map(parseWell);
                        const fileBox = boundingRect(fileWells) || { anchor: { row: 0, col: 0 }, rows: 3, cols: 8 };

                        setRemapState({
                            layoutSamples: layoutSamplesRaw,
                            layoutColumns: nextColumns,
                            includeAlias: nextIncludeAlias,
                            layoutBox,
                            fileWellSet: new Set(fileWellNames),
                            fileAnchor: fileBox.anchor,
                            rows: fileBox.rows,
                            cols: fileBox.cols,
                            order: 'row'
                        });
                        return;
                    }

                    setIncludeAlias(nextIncludeAlias);
                    setSelectedColumns(nextColumns);
                    setSelectedSamples(exact.length > 0 ? exact : baseSampleOrder.map(name => ({ name, alias: '' })));
                    if (hadMissing || exact.length === 0) {
                        setError('Layout imported with missing columns/samples that do not exist in this file.');
                    }
                } catch (err) {
                    setError(`Layout import failed: ${err.message}`);
                }
            };

            const computeRemapMapping = (state) => {
                if (!state) return [];
                const targetWells = enumerateRect(state.fileAnchor, state.rows, state.cols, state.order)
                    .filter(w => w.row <= 7 && w.col <= 11);
                // Assign one target per unique source well (first-encounter order) so duplicates share a target.
                const sourceKeyToOrdinal = new Map();
                state.layoutSamples.forEach(s => {
                    const w = parseWell(s.name);
                    if (!w) return;
                    const key = `${w.row},${w.col}`;
                    if (!sourceKeyToOrdinal.has(key)) sourceKeyToOrdinal.set(key, sourceKeyToOrdinal.size);
                });
                const mapping = [];
                state.layoutSamples.forEach((s) => {
                    const w = parseWell(s.name);
                    if (!w) {
                        mapping.push({ source: s, ordinal: null, target: null, targetName: null, valid: false, reason: 'non-well name' });
                        return;
                    }
                    const ordinal = sourceKeyToOrdinal.get(`${w.row},${w.col}`);
                    const target = targetWells[ordinal];
                    if (!target) {
                        mapping.push({ source: s, ordinal, target: null, targetName: null, valid: false, reason: 'past rect' });
                        return;
                    }
                    const targetName = wellName(target.row, target.col);
                    const inFile = state.fileWellSet.has(targetName);
                    mapping.push({ source: s, ordinal, target, targetName, valid: inFile, reason: inFile ? null : 'not in file' });
                });
                return mapping;
            };

            const applyRemap = () => {
                if (!remapState) return;
                const mapping = computeRemapMapping(remapState);
                const nextSamples = mapping
                    .filter(m => m.valid)
                    .map(m => ({ name: m.targetName, alias: m.source.alias || '' }));
                setIncludeAlias(remapState.includeAlias);
                setSelectedColumns(remapState.layoutColumns);
                setSelectedSamples(nextSamples.length > 0 ? nextSamples : baseSampleOrder.map(name => ({ name, alias: '' })));
                if (nextSamples.length < remapState.layoutSamples.length) {
                    setError(`Remap complete: ${nextSamples.length}/${remapState.layoutSamples.length} samples mapped. Remainder had no matching well.`);
                } else {
                    setError(null);
                }
                setRemapState(null);
            };

            const renderMeltedPreview = () => {
                const outputData = buildOutputData();
                if (!outputData || outputData.length === 0) return null;

                const firstSample = outputData[0];
                const columns = Object.keys(firstSample);
                const maxColumns = 10; // Show first 10 columns for preview

                return (
                    <div className="mt-6 mb-4">
                        <h3 className="text-lg font-semibold mb-4">Preview of Melted X/Y Table</h3>
                        <p className="text-sm text-gray-600 mb-4">
                            Rows: Samples ({outputData.length}) | Columns: Gates/Frequencies ({Math.max(columns.length - 1, 0)})
                        </p>
                        <div className="overflow-x-auto">
                            <table className="min-w-full border-collapse border border-gray-300 text-xs">
                                <thead>
                                    <tr className="bg-gray-100">
                                        {columns.slice(0, maxColumns).map((col, index) => (
                                            <th key={index} className="border border-gray-300 px-2 py-1 text-left font-medium">
                                                {col}
                                            </th>
                                        ))}
                                        {columns.length > maxColumns && (
                                            <th className="border border-gray-300 px-2 py-1 text-left font-medium">
                                                ...
                                            </th>
                                        )}
                                    </tr>
                                </thead>
                                <tbody>
                                    {outputData.slice(0, 5).map((row, rowIndex) => (
                                        <tr key={rowIndex} className={rowIndex % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                            {columns.slice(0, maxColumns).map((col, colIndex) => (
                                                <td key={colIndex} className={`border border-gray-300 px-2 py-1 ${getCellClass(col)}`}>
                                                    {row[col]}
                                                </td>
                                            ))}
                                            {columns.length > maxColumns && (
                                                <td className="border border-gray-300 px-2 py-1 text-gray-400">
                                                    ...
                                                </td>
                                            )}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderPreviewNote = () => {
                const outputData = buildOutputData();
                if (!outputData || outputData.length === 0) return null;
                const columns = Object.keys(outputData[0] || {});
                return (
                    <div className="mt-4 text-sm text-gray-600">
                        <p>• Showing first {Math.min(5, outputData.length)} samples and first {Math.min(10, columns.length)} columns</p>
                        <p>• Column format: Depth.GateName.Type</p>
                        <p>• Gate columns: ".Count" (cell counts) and ".%" (percentages)</p>
                        <p>• Frequency columns: ".Freq" (frequency percentages)</p>
                        <p>• Examples: "0.Total Event.Count", "1.Lymphocytes.%", "2.HSC of Live_Lin-.Freq"</p>
                        <p>• Download full table to see all {outputData.length} samples × {columns.length} columns</p>
                    </div>
                );
            };

            return (
                <div className="max-w-7xl mx-auto p-6">
                    <div className="mb-8 flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">FACS Data Transformer - Melted X/Y Table</h1>
                            <p className="text-gray-600">
                                Transform hierarchical FACS data into a melted X/Y table where rows are samples and columns are gates/frequencies.
                            </p>
                        </div>
                        {meltedData && (
                            <div className="w-full max-w-xl">
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={downloadMeltedData}
                                        className="col-span-2 flex items-center justify-center px-5 py-2.5 bg-[#81f494] text-slate-900 rounded-lg hover:bg-[#6fe887] transition-colors"
                                    >
                                        <Download className="h-5 w-5 mr-2" />
                                        Download Melted X/Y Table
                                    </button>
                                    <button
                                        onClick={downloadLayout}
                                        className="flex items-center justify-center px-4 py-2.5 bg-[#3ed3d6] text-slate-900 rounded-lg hover:bg-[#2fc4c7] transition-colors"
                                    >
                                        <Download className="h-5 w-5 mr-2" />
                                        Download Layout
                                    </button>
                                    <label className="flex items-center justify-center px-4 py-2.5 bg-[#a8acea] text-slate-900 rounded-lg hover:bg-[#969be0] transition-colors cursor-pointer">
                                        <Upload className="h-5 w-5 mr-2" />
                                        Upload Layout
                                        <input
                                            type="file"
                                            accept=".json"
                                            onChange={handleLayoutUpload}
                                            className="hidden"
                                        />
                                    </label>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="mb-6">
                        <div className="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
                            <Upload className="mx-auto h-12 w-12 text-gray-400 mb-4" />
                            <div className="mb-4">
                                <label htmlFor="file-upload" className="cursor-pointer">
                                    <span className="text-lg font-medium text-blue-600 hover:text-blue-500">
                                        Upload FACS Excel file
                                    </span>
                                    <input
                                        id="file-upload"
                                        type="file"
                                        accept=".xls,.xlsx"
                                        onChange={handleFileUpload}
                                        className="hidden"
                                    />
                                </label>
                            </div>
                            <p className="text-sm text-gray-500">
                                Supports .xls and .xlsx files with hierarchical FACS gating data
                            </p>
                        </div>
                    </div>

                    {processing && (
                        <div className="mb-6 p-4 bg-blue-50 rounded-lg flex items-center">
                            <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600 mr-3"></div>
                            <span className="text-blue-800">Processing file...</span>
                        </div>
                    )}

                    {error && (
                        <div className="mb-6 p-4 bg-red-50 rounded-lg flex items-center">
                            <AlertCircle className="h-6 w-6 text-red-600 mr-3" />
                            <span className="text-red-800">{error}</span>
                        </div>
                    )}

                    {stats && (
                        <div className="mb-6 grid grid-cols-2 md:grid-cols-5 gap-4">
                            <div className="bg-blue-50 p-4 rounded-lg">
                                <div className="text-2xl font-bold text-blue-600">{stats.totalRows}</div>
                                <div className="text-sm text-blue-800">Total Rows</div>
                            </div>
                            <div className="bg-green-50 p-4 rounded-lg">
                                <div className="text-2xl font-bold text-green-600">{stats.samples}</div>
                                <div className="text-sm text-green-800">Samples</div>
                            </div>
                            <div className="bg-purple-50 p-4 rounded-lg">
                                <div className="text-2xl font-bold text-purple-600">{stats.uniqueGates}</div>
                                <div className="text-sm text-purple-800">Unique Gates</div>
                            </div>
                            <div className="bg-yellow-50 p-4 rounded-lg">
                                <div className="text-2xl font-bold text-yellow-600">{stats.gateRows}</div>
                                <div className="text-sm text-yellow-800">Gate Rows</div>
                            </div>
                            <div className="bg-indigo-50 p-4 rounded-lg">
                                <div className="text-2xl font-bold text-indigo-600">{stats.frequencyRows}</div>
                                <div className="text-sm text-indigo-800">Frequency Rows</div>
                            </div>
                        </div>
                    )}

                    {renderMeltedPreview()}

                    {meltedData && (
                        <div className="mb-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white border border-gray-200 rounded-lg p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-lg font-semibold">Column Selection & Order</h3>
                                </div>
                                <div className="flex items-center gap-2 mb-4">
                                    <input
                                        id="include-alias"
                                        type="checkbox"
                                        checked={includeAlias}
                                        onChange={(e) => toggleAliasColumn(e.target.checked)}
                                    />
                                    <label htmlFor="include-alias" className="text-sm text-gray-700">
                                        Include editable Sample Alias column
                                    </label>
                                </div>
                                <div className="mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="text-sm font-medium text-gray-700">Selected columns</div>
                                        <button
                                            onClick={() => {
                                                setIncludeAlias(false);
                                                setSelectedColumns(baseColumnOrder);
                                            }}
                                            className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                        >
                                            Reset
                                        </button>
                                    </div>
                                    <div className="space-y-1">
                                        {selectedColumns.map((col, index) => {
                                            const isDragging = dragItem && dragItem.type === 'columns' && dragItem.index === index;
                                            const isDropTarget = dragOver && dragOver.type === 'columns' && dragOver.index === index && !isDragging;
                                            return (
                                            <div
                                                key={`${col}-${index}`}
                                                className={`flex items-center justify-between rounded-md px-2.5 py-1 text-sm cursor-move border transition-all ${
                                                    isDragging
                                                        ? 'bg-blue-100 border-blue-400 shadow-md'
                                                        : `${getColumnBadgeClass(col)} hover:border-blue-300 hover:shadow-sm`
                                                } ${isDropTarget ? 'shadow-[inset_0_0_0_2px_rgba(0,0,0,0.75)]' : ''}`}
                                                draggable
                                                onDragStart={() => handleDragStart('columns', index)}
                                                onDragOver={(event) => handleDragOver(event, 'columns', index)}
                                                onDrop={() => handleDrop('columns', index)}
                                                onDragEnd={handleDragEnd}
                                            >
                                                <span className="truncate">{col}</span>
                                                <div className="flex items-center gap-1">
                                                    <button
                                                        onClick={() => setSelectedColumns(moveItem(selectedColumns, index, index - 1))}
                                                        className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                    >
                                                        Up
                                                    </button>
                                                    <button
                                                        onClick={() => setSelectedColumns(moveItem(selectedColumns, index, index + 1))}
                                                        className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                    >
                                                        Down
                                                    </button>
                                                    <button
                                                        onClick={() => setSelectedColumns(selectedColumns.filter((_, i) => i !== index))}
                                                        className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                    >
                                                        Remove
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                        })}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-sm font-medium text-gray-700 mb-2">Available columns</div>
                                    <div className="space-y-1">
                                        {getAvailableColumns().map((col) => (
                                            <div key={col} className={`flex items-center justify-between rounded-md px-2.5 py-1 text-sm border ${getColumnBadgeClass(col)}`}>
                                                <span className="truncate">{col}</span>
                                                <button
                                                    onClick={() => setSelectedColumns([...selectedColumns, col])}
                                                    className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                >
                                                    Add
                                                </button>
                                            </div>
                                        ))}
                                        {getAvailableColumns().length === 0 && (
                                            <div className="text-xs text-gray-500">All columns are selected.</div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white border border-gray-200 rounded-lg p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-lg font-semibold">Sample Selection & Order</h3>
                                </div>
                                <div className="mb-3">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="text-sm font-medium text-gray-700">Selected samples</div>
                                        <button
                                            onClick={() => setSelectedSamples(baseSampleOrder.map((name) => ({ name, alias: '' })))}
                                            className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                        >
                                            Reset
                                        </button>
                                    </div>
                                    <div className="space-y-1">
                                        {selectedSamples.map((entry, index) => {
                                            const isDragging = dragItem && dragItem.type === 'samples' && dragItem.index === index;
                                            const isDropTarget = dragOver && dragOver.type === 'samples' && dragOver.index === index && !isDragging;
                                            return (
                                            <div
                                                key={`${entry.name}-${index}`}
                                                className={`rounded-md px-2.5 py-1 text-sm cursor-move border transition-all ${
                                                    isDragging
                                                        ? 'bg-blue-100 border-blue-400 shadow-md'
                                                        : 'bg-white border-gray-200 hover:border-blue-300 hover:shadow-sm'
                                                } ${isDropTarget ? 'shadow-[inset_0_0_0_2px_rgba(0,0,0,0.75)]' : ''}`}
                                                draggable
                                                onDragStart={() => handleDragStart('samples', index)}
                                                onDragOver={(event) => handleDragOver(event, 'samples', index)}
                                                onDrop={() => handleDrop('samples', index)}
                                                onDragEnd={handleDragEnd}
                                            >
                                                <div className="flex items-center justify-between gap-1 mb-1">
                                                    <span className="truncate">{entry.name}</span>
                                                    <div className="flex items-center gap-1">
                                                        <button
                                                            onClick={() => setSelectedSamples(moveItem(selectedSamples, index, index - 1))}
                                                            className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                            tabIndex={-1}
                                                        >
                                                            Up
                                                        </button>
                                                        <button
                                                            onClick={() => setSelectedSamples(moveItem(selectedSamples, index, index + 1))}
                                                            className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                            tabIndex={-1}
                                                        >
                                                            Down
                                                        </button>
                                                        <button
                                                            onClick={() => setSelectedSamples([...selectedSamples.slice(0, index + 1), { name: entry.name, alias: entry.alias || '' }, ...selectedSamples.slice(index + 1)])}
                                                            className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                            tabIndex={-1}
                                                        >
                                                            Duplicate
                                                        </button>
                                                        <button
                                                            onClick={() => setSelectedSamples(selectedSamples.filter((_, i) => i !== index))}
                                                            className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                            tabIndex={-1}
                                                        >
                                                            Remove
                                                        </button>
                                                    </div>
                                                </div>
                                                {includeAlias && (
                                                    <div className="flex items-center gap-1">
                                                        <label className="text-xs text-gray-600">Alias</label>
                                                        <input
                                                            type="text"
                                                            value={entry.alias || ''}
                                                            onChange={(e) => {
                                                                const next = selectedSamples.slice();
                                                                next[index] = { ...next[index], alias: e.target.value };
                                                                setSelectedSamples(next);
                                                            }}
                                                            className="flex-1 px-2 py-0.5 border rounded text-xs"
                                                            placeholder="Optional sample alias"
                                                        />
                                                    </div>
                                                )}
                                            </div>
                                        );
                                        })}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-sm font-medium text-gray-700 mb-2">Available samples</div>
                                    <div className="space-y-1">
                                        {getAvailableSamples().map((name) => (
                                            <div key={name} className="flex items-center justify-between bg-white border border-gray-200 rounded-md px-2.5 py-1 text-sm">
                                                <span className="truncate">{name}</span>
                                                <button
                                                    onClick={() => setSelectedSamples([...selectedSamples, { name, alias: '' }])}
                                                    className="text-xs px-2 py-0.5 border rounded hover:bg-white"
                                                >
                                                    Add
                                                </button>
                                            </div>
                                        ))}
                                        {getAvailableSamples().length === 0 && (
                                            <div className="text-xs text-gray-500">All samples are selected.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="mt-8 p-6 bg-gray-50 rounded-lg">
                        <h3 className="text-lg font-semibold mb-4 flex items-center">
                            <FileText className="h-5 w-5 mr-2" />
                            Melted Table Format
                        </h3>
                        <ul className="space-y-2 text-sm text-gray-700">
                            <li>• <strong>Rows:</strong> Each row represents one sample</li>
                            <li>• <strong>Columns:</strong> Each gate or frequency measurement</li>
                            <li>• <strong>Gate columns:</strong> Two columns per gate - ".Count" (cell counts) and ".%" (percentages)</li>
                            <li>• <strong>Frequency columns:</strong> One column per frequency - ".Freq" (frequency percentages)</li>
                            <li>• <strong>Column naming:</strong> Depth.GateName.Type (e.g., "0.Total Event.Count", "1.Lymphocytes.%", "2.HSC of Live_Lin-.Freq")</li>
                            <li>• <strong>Depth 0 gates:</strong> Renamed to "Total Event" for clarity</li>
                            <li>• <strong>Missing data:</strong> Empty cells where a gate/frequency doesn't exist for a sample</li>
                        </ul>
                    </div>

                    {renderPreviewNote()}

                    {remapState && renderRemapDialog()}
                </div>
            );

            function renderRemapDialog() {
                const mapping = computeRemapMapping(remapState);
                const targetWellMap = new Map();
                mapping.forEach((m) => {
                    if (m.target && m.ordinal != null) {
                        const key = `${m.target.row},${m.target.col}`;
                        const existing = targetWellMap.get(key);
                        if (existing) {
                            existing.count += 1;
                            if (m.source.alias) existing.aliases.push(m.source.alias);
                        } else {
                            targetWellMap.set(key, { ordinal: m.ordinal, valid: m.valid, count: 1, source: m.source.name, aliases: m.source.alias ? [m.source.alias] : [] });
                        }
                    }
                });

                const layoutWellMap = new Map();
                remapState.layoutSamples.forEach((s) => {
                    const w = parseWell(s.name);
                    if (!w) return;
                    const key = `${w.row},${w.col}`;
                    const existing = layoutWellMap.get(key);
                    if (existing) {
                        existing.count += 1;
                        if (s.alias) existing.aliases.push(s.alias);
                    } else {
                        layoutWellMap.set(key, { idx: layoutWellMap.size, name: s.name, count: 1, aliases: s.alias ? [s.alias] : [] });
                    }
                });

                const mappedCount = mapping.filter(m => m.valid).length;
                const droppedCount = remapState.layoutSamples.length - mappedCount;

                const renderPlate = (title, cellFor) => (
                    <div>
                        <div className="text-sm font-medium mb-1">{title}</div>
                        <div className="inline-block border border-gray-300 bg-white p-1 rounded">
                            <div className="flex">
                                <div className="w-5 h-5" />
                                {Array.from({ length: 12 }).map((_, c) => (
                                    <div key={c} className="w-6 h-5 text-[10px] text-gray-500 flex items-center justify-center">{c + 1}</div>
                                ))}
                            </div>
                            {Array.from({ length: 8 }).map((_, r) => (
                                <div key={r} className="flex">
                                    <div className="w-5 h-6 text-[10px] text-gray-500 flex items-center justify-center">{String.fromCharCode(65 + r)}</div>
                                    {Array.from({ length: 12 }).map((_, c) => cellFor(r, c))}
                                </div>
                            ))}
                        </div>
                    </div>
                );

                const layoutCell = (r, c) => {
                    const info = layoutWellMap.get(`${r},${c}`);
                    const cls = info
                        ? 'bg-indigo-200 border-indigo-400 text-indigo-900'
                        : 'bg-gray-50 border-gray-200 text-gray-300';
                    const label = info ? `${info.idx + 1}${info.count > 1 ? `×${info.count}` : ''}` : '';
                    const title = info
                        ? `${wellName(r, c)} (×${info.count})${info.aliases.length ? ' → ' + info.aliases.join(', ') : ''}`
                        : wellName(r, c);
                    return (
                        <div key={c} className={`w-6 h-6 border text-[9px] flex items-center justify-center ${cls}`} title={title}>
                            {label}
                        </div>
                    );
                };

                const fileCell = (r, c) => {
                    const inFile = remapState.fileWellSet.has(wellName(r, c));
                    const target = targetWellMap.get(`${r},${c}`);
                    const inRect =
                        r >= remapState.fileAnchor.row && r < remapState.fileAnchor.row + remapState.rows &&
                        c >= remapState.fileAnchor.col && c < remapState.fileAnchor.col + remapState.cols;
                    let cls = 'bg-gray-50 border-gray-200 text-gray-300';
                    if (target && target.valid) cls = 'bg-emerald-200 border-emerald-500 text-emerald-900';
                    else if (target && !target.valid) cls = 'bg-red-100 border-red-400 text-red-800';
                    else if (inFile && !inRect) cls = 'bg-amber-100 border-amber-400 text-amber-800';
                    else if (inFile) cls = 'bg-white border-gray-300 text-gray-500';
                    else if (inRect) cls = 'bg-gray-100 border-gray-300 text-gray-400';
                    const label = target ? `${target.ordinal + 1}${target.count > 1 ? `×${target.count}` : ''}` : (inFile ? '·' : '');
                    const title = target
                        ? `${wellName(r, c)} ← ${target.source} (×${target.count})${target.aliases.length ? ' [' + target.aliases.join(', ') + ']' : ''}`
                        : wellName(r, c);
                    return (
                        <div
                            key={c}
                            className={`w-6 h-6 border text-[9px] flex items-center justify-center cursor-pointer ${cls}`}
                            title={title}
                            onClick={() => setRemapState({ ...remapState, fileAnchor: { row: r, col: c } })}
                        >{label}</div>
                    );
                };

                return (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                        <div className="bg-white rounded-lg shadow-xl max-w-5xl w-full max-h-[95vh] overflow-auto p-6">
                            <h3 className="text-xl font-semibold mb-2">Remap wells</h3>
                            <p className="text-sm text-gray-600 mb-4">
                                Layout wells don't all exist in this file. Pick the file's top-left anchor and shape,
                                then confirm. Aliases will follow the ordinal position of each layout sample.
                            </p>

                            <div className="flex flex-wrap gap-6 mb-4">
                                {renderPlate(`Layout plate (${remapState.layoutSamples.length} samples, numbered by order)`, layoutCell)}
                                {renderPlate('File plate (click a well to set top-left anchor)', fileCell)}
                            </div>

                            <div className="flex flex-wrap gap-4 items-end mb-4">
                                <div>
                                    <label className="block text-xs text-gray-600">Anchor row</label>
                                    <select
                                        value={remapState.fileAnchor.row}
                                        onChange={(e) => setRemapState({ ...remapState, fileAnchor: { ...remapState.fileAnchor, row: parseInt(e.target.value, 10) } })}
                                        className="border rounded px-2 py-1 text-sm"
                                    >
                                        {Array.from({ length: 8 }).map((_, i) => (
                                            <option key={i} value={i}>{String.fromCharCode(65 + i)}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs text-gray-600">Anchor col</label>
                                    <select
                                        value={remapState.fileAnchor.col}
                                        onChange={(e) => setRemapState({ ...remapState, fileAnchor: { ...remapState.fileAnchor, col: parseInt(e.target.value, 10) } })}
                                        className="border rounded px-2 py-1 text-sm"
                                    >
                                        {Array.from({ length: 12 }).map((_, i) => (
                                            <option key={i} value={i}>{i + 1}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs text-gray-600">Rows</label>
                                    <input
                                        type="number" min={1} max={8}
                                        value={remapState.rows}
                                        onChange={(e) => setRemapState({ ...remapState, rows: Math.max(1, Math.min(8, parseInt(e.target.value, 10) || 1)) })}
                                        className="border rounded px-2 py-1 text-sm w-16"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-gray-600">Cols</label>
                                    <input
                                        type="number" min={1} max={12}
                                        value={remapState.cols}
                                        onChange={(e) => setRemapState({ ...remapState, cols: Math.max(1, Math.min(12, parseInt(e.target.value, 10) || 1)) })}
                                        className="border rounded px-2 py-1 text-sm w-16"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-gray-600">Scan order</label>
                                    <select
                                        value={remapState.order}
                                        onChange={(e) => setRemapState({ ...remapState, order: e.target.value })}
                                        className="border rounded px-2 py-1 text-sm"
                                    >
                                        <option value="row">Row-major (A1, A2, A3, …)</option>
                                        <option value="col">Column-major (A1, B1, C1, …)</option>
                                    </select>
                                </div>
                            </div>

                            <div className="text-xs text-gray-600 mb-3 flex gap-4 flex-wrap">
                                <span><span className="inline-block w-3 h-3 bg-indigo-200 border border-indigo-400 mr-1 align-middle" />Layout well</span>
                                <span><span className="inline-block w-3 h-3 bg-emerald-200 border border-emerald-500 mr-1 align-middle" />Mapped (in file)</span>
                                <span><span className="inline-block w-3 h-3 bg-red-100 border border-red-400 mr-1 align-middle" />Target well not in file</span>
                                <span><span className="inline-block w-3 h-3 bg-amber-100 border border-amber-400 mr-1 align-middle" />Extra file well (omitted)</span>
                                <span><span className="inline-block w-3 h-3 bg-white border border-gray-300 mr-1 align-middle" />File well outside rect</span>
                            </div>

                            <div className="mb-3 text-sm">
                                <span className="font-medium">{mappedCount}</span> mapped, <span className="font-medium">{droppedCount}</span> dropped
                            </div>

                            <div className="max-h-48 overflow-auto border rounded mb-4">
                                <table className="w-full text-xs">
                                    <thead className="bg-gray-100 sticky top-0">
                                        <tr>
                                            <th className="px-2 py-1 text-left">#</th>
                                            <th className="px-2 py-1 text-left">Layout well</th>
                                            <th className="px-2 py-1 text-left">Alias</th>
                                            <th className="px-2 py-1 text-left">→ File well</th>
                                            <th className="px-2 py-1 text-left">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {mapping.map((m, i) => (
                                            <tr key={i} className={m.valid ? '' : 'bg-red-50'}>
                                                <td className="px-2 py-1">{m.ordinal != null ? m.ordinal + 1 : '—'}</td>
                                                <td className="px-2 py-1">{m.source.name}</td>
                                                <td className="px-2 py-1">{m.source.alias || ''}</td>
                                                <td className="px-2 py-1">{m.targetName || '—'}</td>
                                                <td className="px-2 py-1">{m.valid ? 'ok' : (m.reason || 'dropped')}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="flex justify-end gap-2">
                                <button
                                    onClick={() => setRemapState(null)}
                                    className="px-4 py-2 border rounded hover:bg-gray-50"
                                >Cancel</button>
                                <button
                                    onClick={applyRemap}
                                    disabled={mappedCount === 0}
                                    className="px-4 py-2 bg-emerald-500 text-white rounded hover:bg-emerald-600 disabled:opacity-50"
                                >Apply remap</button>
                            </div>
                        </div>
                    </div>
                );
            }
        };

        ReactDOM.render(<FacsDataTransformer />, document.getElementById('root'));
    </script>
</body>
</html>
